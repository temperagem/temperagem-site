<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Authorization - Temperagem</title>
<style>
  :root{--pink:#ff4d74;--ink:#2b1d1d;--bg:#fff7f4}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
  header{background:var(--pink);color:#fff;padding:28px 20px;text-align:center}
  header h1{margin:0;font-size:1.8rem}
  main{max-width:760px;margin:0 auto;padding:24px 20px 60px}
  textarea{width:100%;height:110px;font-family:Consolas,monospace;font-size:.95rem;padding:10px;border:2px solid var(--pink);border-radius:8px;resize:vertical}
  button{background:var(--pink);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:10px}
  .err{color:#b3243f;font-weight:600}
  a{color:#b3243f}
</style>
</head>
<body>
<header><h1>Temperagem</h1><p>TikTok authorization</p></header>
<main>
  <p id="msg">Reading authorization result...</p>
  <div id="box" style="display:none">
    <p>Copy the code below and paste it into the Temperagem Automacao desktop tool.</p>
    <textarea id="code" readonly></textarea><br>
    <button id="copy" type="button">Copy code</button>
  </div>
  <p><a href="index.html">Back to home</a> &middot; <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a></p>
</main>
<script>
  var p = new URLSearchParams(window.location.search);
  var code = p.get("code");
  var error = p.get("error");
  var msg = document.getElementById("msg");
  if (error) {
    msg.className = "err";
    msg.textContent = "Authorization was not completed: " + error + (p.get("error_description") ? " - " + p.get("error_description") : "");
  } else if (code) {
    msg.textContent = "Authorization received.";
    document.getElementById("box").style.display = "block";
    var ta = document.getElementById("code");
    ta.value = code;
    document.getElementById("copy").addEventListener("click", function () {
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      if (navigator.clipboard) { navigator.clipboard.writeText(ta.value); }
      this.textContent = "Copied!";
    });
  } else {
    msg.textContent = "No authorization code found in this address. This page is used only as the return address of the TikTok login.";
  }
</script>
</body>
</html>
